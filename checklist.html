<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>民泊清掃チェック</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --teal:#0F6E56;--teal-mid:#1D9E75;--teal-l:#E1F5EE;--teal-ll:#f0faf6;
    --red:#E24B4A;--red-l:#FCEBEB;--red-mid:#f07070;
    --gray:#F5F4F0;--gray-d:#888780;--text:#2C2C2A;--text-s:#5F5E5A;
    --discord:#5865F2;--radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Noto Sans JP',sans-serif;background:#f0faf6;color:var(--text);min-height:100vh;}
  .header{background:var(--teal);padding:14px 14px 10px;position:sticky;top:0;z-index:100;}
  .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .header-title{color:white;font-size:16px;font-weight:700;}
  .ng-chip{display:none;background:rgba(255,255,255,0.2);color:white;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;}
  .ng-chip.show{display:inline;}
  .header-meta{display:flex;gap:7px;margin-bottom:6px;}
  .meta-input{flex:1;background:rgba(255,255,255,0.15);border:none;border-radius:8px;padding:7px 10px;color:white;font-size:13px;font-family:inherit;outline:none;}
  .meta-input::placeholder{color:rgba(255,255,255,0.55);}
  .meta-select{flex:1;background:rgba(255,255,255,0.15);border:none;border-radius:8px;padding:7px 10px;color:white;font-size:13px;font-family:inherit;outline:none;appearance:none;-webkit-appearance:none;}
  .meta-select option{color:var(--text);background:white;}
  .progress-bar{height:4px;background:rgba(255,255,255,0.25);border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;background:white;border-radius:99px;transition:width .35s ease;}
  .progress-label{color:rgba(255,255,255,.85);font-size:11px;margin-top:4px;text-align:right;}
  .content{padding:10px 10px 140px;}
  .section{margin-bottom:9px;background:white;border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 8px rgba(15,110,86,.08);}
  .section-header{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;background:var(--teal);cursor:pointer;user-select:none;}
  .section-title{color:white;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .section-badge{font-size:11px;background:rgba(255,255,255,.2);color:white;padding:2px 9px;border-radius:99px;white-space:nowrap;}
  .section-badge.done{background:white;color:var(--teal);font-weight:700;}
  .item{display:flex;align-items:center;border-bottom:1px solid #f0f0ee;cursor:pointer;transition:background .1s;}
  .item.checked{background:var(--teal-ll);}
  .item.ng{background:var(--red-l);}
  .item:active{filter:brightness(0.97);}
  .check-area{width:50px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:13px 0;align-self:flex-start;padding-top:15px;}
  .check-circle{width:27px;height:27px;border-radius:50%;border:2px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:15px;background:white;transition:all .15s;}
  .item.checked .check-circle{background:var(--teal-mid);border-color:var(--teal-mid);color:white;}
  .item.ng .check-circle{background:var(--red);border-color:var(--red);color:white;}
  .item-body{flex:1;padding:11px 8px 11px 0;}
  .item-num{font-size:10px;color:var(--gray-d);margin-bottom:1px;}
  .item-label{font-size:14px;font-weight:500;line-height:1.4;}
  .item.checked .item-label{color:var(--teal);}
  .item.ng .item-label{color:var(--red);}
  .item-note{font-size:11px;color:var(--gray-d);margin-top:2px;line-height:1.4;}
  .item-actions{display:flex;align-items:center;gap:4px;padding:0 10px 0 4px;flex-shrink:0;align-self:flex-start;padding-top:13px;}
  .ng-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid #ddd;background:white;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#bbb;cursor:pointer;flex-shrink:0;}
  .item.ng .ng-btn{border-color:var(--red);background:var(--red-l);color:var(--red);}
  .photo-btn{width:32px;height:32px;border-radius:8px;border:1.5px dashed #ccc;background:white;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;position:relative;overflow:hidden;}
  .photo-btn.has-photo{border-style:solid;border-color:var(--teal-mid);}
  .photo-btn img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
  .photo-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
  .photo-count{font-size:10px;color:var(--teal);font-weight:700;position:absolute;bottom:1px;right:2px;background:rgba(255,255,255,.85);line-height:1;border-radius:3px;padding:0 1px;}
  .item-extra{display:none;padding:0 12px 10px 50px;gap:6px;flex-direction:column;}
  .item-extra.show{display:flex;}
  .memo-input{width:100%;border:1.5px solid #e0e0dc;border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;color:var(--text);resize:none;outline:none;background:white;min-height:38px;}
  .item.ng .memo-input{border-color:var(--red-mid);background:#fff8f8;}
  .memo-input:focus{border-color:var(--teal-mid);}
  .photo-strip{display:flex;gap:6px;flex-wrap:wrap;}
  .thumb-wrap{position:relative;width:52px;height:52px;border-radius:8px;overflow:hidden;border:1.5px solid var(--teal-l);flex-shrink:0;}
  .thumb-wrap img{width:100%;height:100%;object-fit:cover;}
  .thumb-del{position:absolute;top:1px;right:1px;width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.55);color:white;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .comment-section{margin:0 10px 10px;background:white;border-radius:var(--radius);box-shadow:0 2px 8px rgba(15,110,86,.08);overflow:hidden;}
  .comment-header{background:var(--teal);padding:10px 13px;}
  .comment-header-title{color:white;font-size:14px;font-weight:700;}
  .comment-body{padding:12px;}
  .comment-textarea{width:100%;border:1.5px solid #e0e0dc;border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;color:var(--text);resize:none;outline:none;background:white;min-height:80px;line-height:1.6;}
  .comment-textarea:focus{border-color:var(--teal-mid);}
  .comment-textarea::placeholder{color:#bbb;}
  .bottom-bar{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #eee;padding:10px 12px;display:flex;gap:8px;z-index:200;}
  .btn-send{flex:1;background:var(--discord);color:white;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;}
  .btn-send:disabled{background:#aaa;cursor:not-allowed;}
  .btn-reset{width:48px;background:var(--gray);color:var(--gray-d);border:none;border-radius:10px;font-size:12px;font-family:inherit;cursor:pointer;}
  .complete-banner{display:none;background:var(--teal);color:white;text-align:center;padding:10px;font-size:13px;font-weight:700;}
  .complete-banner.show{display:block;}
  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#2C2C2A;color:white;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:1;}
</style>
</head>

var state = {};
SECTIONS.forEach(function(s, si) {
  s.items.forEach(function(_, ii) {
    state[si + '-' + ii] = {status:0, memo:'', photos:[]};
  });
});

function totalItems() { return Object.keys(state).length; }
function doneCount()  { return Object.values(state).filter(function(v){return v.status===1;}).length; }
function ngCount()    { return Object.values(state).filter(function(v){return v.status===2;}).length; }
function totalPhotos(){ return Object.values(state).reduce(function(a,v){return a+v.photos.length;},0); }

function showToast(msg, duration) {
  duration = duration || 3000;
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show';
  setTimeout(function(){ t.className = 'toast'; }, duration);
}

function loadStaffList() {
  var sel = document.getElementById('staffSelect');
  var cbName = 'cb_staff_' + Date.now();
  var timer = setTimeout(function() {
    sel.innerHTML = '<option value="">取得失敗 - ページを再読み込みしてください</option>';
  }, 10000);
  window[cbName] = function(data) {
    clearTimeout(timer);
    delete window[cbName];
    if (data.ok && data.staff && data.staff.length > 0) {
      sel.innerHTML = '<option value="">清掃担当者を選択してください</option>';
      data.staff.forEach(function(s) {
        var opt = document.createElement('option');
        opt.value = s.name; opt.textContent = s.name;
        sel.appendChild(opt);
      });
    } else {
      sel.innerHTML = '<option value="">取得失敗 - ページを再読み込みしてください</option>';
    }
  };
  var script = document.createElement('script');
  script.src = GAS_URL + '?type=init&callback=' + cbName;
  script.onerror = function() {
    clearTimeout(timer);
    sel.innerHTML = '<option value="">取得失敗 - ページを再読み込みしてください</option>';
  };
  document.head.appendChild(script);
}

function tap(si, ii) {
  var k = si + '-' + ii;
  state[k].status = state[k].status === 1 ? 0 : 1;
  refreshItem(si, ii); updateProgress();
}
function tapNg(si, ii, e) {
  e.stopPropagation();
  var k = si + '-' + ii;
  state[k].status = state[k].status === 2 ? 0 : 2;
  refreshItem(si, ii); updateProgress();
  if (state[k].status === 2) {
    setTimeout(function() {
      var m = document.getElementById('memo-' + si + '-' + ii);
      if (m) m.focus();
    }, 100);
  }
}
function updateMemo(si, ii, val) { state[si + '-' + ii].memo = val; }
function handlePhoto(si, ii, input) {
  Array.from(input.files).forEach(function(f) {
    var r = new FileReader();
    r.onload = function(e) {
      state[si + '-' + ii].photos.push({dataUrl: e.target.result, name: f.name, type: f.type});
      refreshItem(si, ii); updateProgress();
    };
    r.readAsDataURL(f);
  });
  input.value = '';
}
function delPhoto(si, ii, idx, e) {
  e.stopPropagation();
  state[si + '-' + ii].photos.splice(idx, 1);
  refreshItem(si, ii); updateProgress();
}

function refreshItem(si, ii) {
  var k = si + '-' + ii;
  var s = state[k];
  var el = document.getElementById('item-' + k);
  el.className = 'item' + (s.status===1?' checked':s.status===2?' ng':'');
  el.querySelector('.check-circle').textContent = s.status===1 ? '✓' : s.status===2 ? '✕' : '';
  var extra = document.getElementById('extra-' + k);
  extra.className = 'item-extra' + (s.status!==0||s.photos.length>0||s.memo ? ' show' : '');
  var memoEl = document.getElementById('memo-' + k);
  if (memoEl && memoEl.value !== s.memo) memoEl.value = s.memo;
  var pb = el.querySelector('.photo-btn');
  pb.className = 'photo-btn' + (s.photos.length > 0 ? ' has-photo' : '');
  var img = pb.querySelector('img');
  if (s.photos.length > 0) { img.src = s.photos[s.photos.length-1].dataUrl; img.style.display = 'block'; }
  else img.style.display = 'none';
  pb.querySelector('.photo-count').textContent = s.photos.length > 0 ? s.photos.length + '枚' : '';
  var strip = document.getElementById('strip-' + k);
  if (s.photos.length > 0) {
    strip.innerHTML = s.photos.map(function(p, i) {
      return '<div class="thumb-wrap"><img src="' + p.dataUrl + '"><div class="thumb-del" onclick="delPhoto(' + si + ',' + ii + ',' + i + ',event)">✕</div></div>';
    }).join('');
  } else strip.innerHTML = '';
  updateSectionBadge(si);
}

function updateSectionBadge(si) {
  var items = SECTIONS[si].items;
  var done = items.filter(function(_,ii){ return state[si+'-'+ii].status===1; }).length;
  var ng   = items.filter(function(_,ii){ return state[si+'-'+ii].status===2; }).length;
  var total = items.length;
  var badge = document.getElementById('badge-' + si);
  var allDone = done === total;
  badge.textContent = allDone ? '完了✓' : (ng>0 ? done+'/'+total+' NG:'+ng : done+'/'+total);
  badge.className = 'section-badge' + (allDone ? ' done' : '');
}

function updateProgress() {
  var done = doneCount(), ng = ngCount(), total = totalItems(), photos = totalPhotos();
  var pct = Math.round(done / total * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent =
    done + '/' + total + ' 完了' + (ng>0?' · NG:'+ng+'件':'') + (photos>0?' · 📷'+photos+'枚':'');
  var chip = document.getElementById('ng-chip');
  if (ng > 0) { chip.textContent = 'NG ' + ng + '件'; chip.className = 'ng-chip show'; }
  else chip.className = 'ng-chip';
  document.getElementById('completeBanner').className = 'complete-banner' + (done===total&&ng===0?' show':'');
}

function buildEmbed() {
  var room    = document.getElementById('roomInput').value || '（未入力）';
  var staff   = document.getElementById('staffSelect').value || '（未選択）';
  var checker = document.getElementById('checkerInput').value || '（未入力）';
  var comment = document.getElementById('commentInput').value || '';
  var done = doneCount(), ng = ngCount(), total = totalItems();
  var now = new Date();
  var dateStr = now.getFullYear() + '/' + (now.getMonth()+1) + '/' + now.getDate() + ' ' + now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');
  var color = ng > 0 ? 0xE24B4A : done===total ? 0x1D9E75 : 0x0F6E56;
  var desc = '✅ **完了：' + done + '/' + total + '項目**';
  if (ng > 0) {
    desc += '\n⚠️ **NG：' + ng + '件**\n';
    SECTIONS.forEach(function(sec, si) {
      sec.items.forEach(function(item, ii) {
        if (state[si+'-'+ii].status === 2) {
          var memo = state[si+'-'+ii].memo;
          desc += '\n' + sec.icon + ' **' + sec.name + '** No.' + item.n + ' ' + item.l;
          if (memo) desc += '\n> 📝 ' + memo;
          desc += '\n';
        }
      });
    });
  } else {
    desc += '\n\n問題なし！全項目クリア 🎉';
  }
  if (comment) desc += '\n\n💬 **一言：** ' + comment;
  return {embeds:[{
    title: '🏠 民泊清掃完了報告',
    description: desc, color: color,
    fields: [
      {name:'📍 物件', value:room, inline:true},
      {name:'🧹 担当', value:staff, inline:true},
      {name:'✅ チェック担当', value:checker, inline:true},
      {name:'🕐 時刻', value:dateStr, inline:true},
    ],
    footer: {text:'民泊清掃チェックシステム'}
  }]};
}

async function dataUrlToBlob(dataUrl) {
  var res = await fetch(dataUrl);
  return await res.blob();
}

async function sendAll() {
  var staff = document.getElementById('staffSelect').value;
  if (!staff) { showToast('❌ 清掃担当者を選択してください', 3000); return; }
  var btn = document.getElementById('sendBtn');
  btn.disabled = true; btn.textContent = '送信中...';
  try {
    var room    = document.getElementById('roomInput').value || '';
    var checker = document.getElementById('checkerInput').value || '';
    var comment = document.getElementById('commentInput').value || '';
    var done = doneCount(), ng = ngCount(), total = totalItems();
    var now = new Date();
    var dateStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
    var ngList = [];
    SECTIONS.forEach(function(sec, si) {
      sec.items.forEach(function(item, ii) {
        if (state[si+'-'+ii].status === 2) {
          var memo = state[si+'-'+ii].memo;
          ngList.push(item.l + (memo ? ' (' + memo + ')' : ''));
        }
      });
    });
    // GASに送信
    await fetch(GAS_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        type: 'check_result', staff: staff, date: dateStr,
        bukken: room, checker: checker,
        doneCount: done, totalCount: total,
        ngItems: ngList.join('|'), comment: comment
      }),
      mode: 'no-cors'
    });
    // Discordにも送信
    var allPhotos = [];
    SECTIONS.forEach(function(sec, si) {
      sec.items.forEach(function(_, ii) {
        state[si+'-'+ii].photos.forEach(function(p) {
          allPhotos.push({dataUrl:p.dataUrl, type:p.type, label: sec.icon + sec.name + ' No.' + sec.items[ii].n});
        });
      });
    });
    var embed = buildEmbed();
    await fetch(WEBHOOK, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(embed)});
    for (var i = 0; i < allPhotos.length; i++) {
      var p = allPhotos[i];
      var blob = await dataUrlToBlob(p.dataUrl);
      var ext = p.type.split('/')[1] || 'jpg';
      var fd = new FormData();
      fd.append('file', blob, 'photo_' + (i+1) + '.' + ext);
      fd.append('payload_json', JSON.stringify({content: '📷 **' + p.label + '** (' + (i+1) + '/' + allPhotos.length + '枚目)'}));
      await fetch(WEBHOOK, {method:'POST', body:fd});
    }
    showToast('✅ 送信完了！' + (allPhotos.length > 0 ? '（写真' + allPhotos.length + '枚含む）' : ''));
  } catch(err) {
    showToast('❌ 送信失敗：' + err.message, 4000);
  } finally {
    btn.disabled = false;
    btn.textContent = '送信';
  }
}


function updateMemoEl(el) {
  var si = el.getAttribute('data-si');
  var ii = el.getAttribute('data-ii');
  state[si + '-' + ii].memo = el.value;
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

function render() {
  var content = document.getElementById('content');
  content.innerHTML = '';
  SECTIONS.forEach(function(sec, si) {
    var secDiv = document.createElement('div');
    secDiv.className = 'section';

    // Section header
    var hdr = document.createElement('div');
    hdr.className = 'section-header';
    hdr.innerHTML = '<div class="section-title">' + sec.icon + ' ' + sec.name + '</div>' +
      '<span class="section-badge" id="badge-' + si + '">0/' + sec.items.length + '</span>';
    hdr.addEventListener('click', function() { toggleSection(si); });
    secDiv.appendChild(hdr);

    // Section body
    var body = document.createElement('div');
    body.className = 'section-body';
    body.id = 'body-' + si;

    sec.items.forEach(function(item, ii) {
      var k = si + '-' + ii;

      // Item row
      var itemEl = document.createElement('div');
      itemEl.className = 'item';
      itemEl.id = 'item-' + k;
      (function(si2, ii2) {
        itemEl.addEventListener('click', function() { tap(si2, ii2); });
      })(si, ii);

      // Check circle
      var checkArea = document.createElement('div');
      checkArea.className = 'check-area';
      var circle = document.createElement('div');
      circle.className = 'check-circle';
      checkArea.appendChild(circle);
      itemEl.appendChild(checkArea);

      // Item body text
      var itemBody = document.createElement('div');
      itemBody.className = 'item-body';
      itemBody.innerHTML = '<div class="item-num">No.' + item.n + '</div>' +
        '<div class="item-label">' + item.l + '</div>' +
        '<div class="item-note">' + item.note + '</div>';
      itemEl.appendChild(itemBody);

      // Actions
      var actions = document.createElement('div');
      actions.className = 'item-actions';

      var ngBtn = document.createElement('div');
      ngBtn.className = 'ng-btn';
      ngBtn.textContent = 'NG';
      (function(si2, ii2) {
        ngBtn.addEventListener('click', function(e) { tapNg(si2, ii2, e); });
      })(si, ii);
      actions.appendChild(ngBtn);

      var photoBtn = document.createElement('div');
      photoBtn.className = 'photo-btn';
      photoBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2"><rect x="3" y="7" width="18" height="14" rx="2"/><circle cx="12" cy="14" r="3"/><path d="M8 7l1.5-3h5L16 7"/></svg>' +
        '<img src="" style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:6px;">' +
        '<span class="photo-count"></span>';
      var fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = 'image/*';
      fileInput.multiple = true;
      (function(si2, ii2) {
        fileInput.addEventListener('change', function() { handlePhoto(si2, ii2, this); });
      })(si, ii);
      photoBtn.appendChild(fileInput);
      photoBtn.addEventListener('click', function(e) { e.stopPropagation(); });
      actions.appendChild(photoBtn);
      itemEl.appendChild(actions);
      body.appendChild(itemEl);

      // Extra area (memo + photos)
      var extra = document.createElement('div');
      extra.className = 'item-extra';
      extra.id = 'extra-' + k;

      var ta = document.createElement('textarea');
      ta.className = 'memo-input';
      ta.id = 'memo-' + k;
      ta.placeholder = '備考・メモ（任意）';
      ta.rows = 1;
      (function(si2, ii2, taEl) {
        taEl.addEventListener('input', function() {
          state[si2 + '-' + ii2].memo = taEl.value;
          taEl.style.height = 'auto';
          taEl.style.height = taEl.scrollHeight + 'px';
        });
        taEl.addEventListener('click', function(e) { e.stopPropagation(); });
      })(si, ii, ta);
      extra.appendChild(ta);

      var strip = document.createElement('div');
      strip.className = 'photo-strip';
      strip.id = 'strip-' + k;
      extra.appendChild(strip);

      body.appendChild(extra);
    });

    secDiv.appendChild(body);
    content.appendChild(secDiv);
  });
  updateProgress();
}

function toggleSection(si) {
  var b = document.getElementById('body-' + si);
  b.style.display = b.style.display === 'none' ? 'block' : 'none';
}

function confirmReset() {
  if (confirm('チェック・備考・写真・メッセージをすべてリセットしますか？')) {
    SECTIONS.forEach(function(s, si) {
      s.items.forEach(function(_, ii) { state[si+'-'+ii] = {status:0, memo:'', photos:[]}; });
    });
    document.getElementById('roomInput').value = '';
    document.getElementById('checkerInput').value = '';
    document.getElementById('commentInput').value = '';
    document.getElementById('staffSelect').value = '';
    render();
  }
}

render();
loadStaffList();
